name: Build consolidated master JSON

on:
  push:
    branches:
      - data/master-json-consolidation
    paths:
      - "scripts/build-master-data.mjs"
      - ".github/workflows/build-master-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build lossless master JSON
        run: node scripts/build-master-data.mjs
      - name: Commit generated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-data.json
          if git diff --cached --quiet; then
            echo "Master JSON is already current."
          else
            git commit -m "Build consolidated master JSON"
            git push
          fi
