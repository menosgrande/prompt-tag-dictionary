name: Import category audit sources into master

on:
  push:
    branches:
      - data/master-json-consolidation
    paths:
      - ".github/workflows/import-category-audit-jsonl.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Import JSONL sources
        run: node scripts/import-category-audit-jsonl.mjs
      - name: Commit updated master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-data.json
          if git diff --cached --quiet; then
            echo "Master already contains the audit sources."
          else
            git commit -m "Import category audit sources into master data"
            git push
          fi
