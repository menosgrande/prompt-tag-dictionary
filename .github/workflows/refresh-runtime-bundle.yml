name: Refresh runtime bundle from master

on:
  push:
    branches:
      - data/master-json-consolidation
    paths:
      - ".github/workflows/refresh-runtime-bundle.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build runtime bundle from canonical master
        run: node scripts/build-dictionary-data.mjs --write
      - name: Commit runtime bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dictionary-data.json
          if git diff --cached --quiet; then
            echo "Runtime bundle is already current."
          else
            git commit -m "Rebuild runtime bundle from master data"
            git push
          fi
