name: Admin script syntax

on:
  push:
    branches:
      - main
      - feature/admin-batch-workflow
    paths:
      - "src/admin.js"
      - "admin.html"
      - "admin.css"
  pull_request:
    branches:
      - main
    paths:
      - "src/admin.js"
      - "admin.html"
      - "admin.css"

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check admin JavaScript syntax
        run: node --check src/admin.js
