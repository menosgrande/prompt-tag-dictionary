name: Refresh translation audit master data

on:
  push:
    branches:
      - data/master-json-consolidation
    paths:
      - ".github/workflows/refresh-translation-audit.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate translation audit
        run: node scripts/audit-translations.mjs --write
      - name: Commit refreshed master and compatibility report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/master-data.json data/translation-audit-candidates.json
          if git diff --cached --quiet; then
            echo "Translation audit is already current."
          else
            git commit -m "Refresh translation audit in master data"
            git push
          fi
