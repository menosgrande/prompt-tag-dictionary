name: Dictionary data check

on:
  push:
    paths:
      - "data/dictionary-data.json"
  pull_request:
    paths:
      - "data/dictionary-data.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate dictionary structure
        run: node scripts/build-dictionary-data.mjs --check
      - name: Check tags and categories
        run: node scripts/audit-tags.mjs
