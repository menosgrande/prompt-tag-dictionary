name: Dictionary data check

on:
  push:
    paths:
      - "data/dictionary-data.json"
      - "exports/dictionary-working.csv"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  pull_request:
    paths:
      - "data/dictionary-data.json"
      - "scripts/**"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate canonical dictionary
        run: node scripts/build-dictionary-data.mjs --check
      - name: Dry-run CSV import against canonical data
        run: node scripts/import-dictionary-csv.mjs --check
      - name: Audit tags and categories
        run: node scripts/audit-tags.mjs
      - name: Audit taxonomy structure
        run: node scripts/audit-taxonomy.mjs
      - name: Audit review metadata
        run: node scripts/audit-tag-management.mjs
      - name: Audit translation candidates
        run: node scripts/audit-translations.mjs
      - name: Audit prompt output order
        run: node scripts/audit-prompt-order.mjs
      - name: Audit tag groups
        run: node scripts/audit-tag-groups.mjs
      - name: Run all Node tests
        run: node --test
